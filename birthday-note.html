<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>For Britt</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Always night-black on purpose, so light and dark use the same tokens. */
  :root {
    --bg: #000000; --ink: #f6f1f3; --muted: #8d90a3; --love: #ff2d3f;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #f6f1f3; --muted: #8d90a3; } }
  :root[data-theme="dark"] { --bg: #000000; --ink: #f6f1f3; --muted: #8d90a3; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; margin: 0; padding: 0 24px; text-align: center;
    font: 400 14px/1.5 "Space Mono", ui-monospace, Menlo, monospace; color: var(--muted);
    opacity: 0; transition: opacity .8s ease; pointer-events: none;
  }
  .hint.show { opacity: 1; }
  .hint .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .reread {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: 0; white-space: nowrap;
    font: 400 14px "Space Mono", ui-monospace, Menlo, monospace; color: var(--ink);
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px; padding: 10px 22px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  .reread.show { opacity: 1; pointer-events: auto; }
  .reread:focus-visible { outline: 2px solid var(--love); outline-offset: 3px; }
  .letter-view {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    background: rgba(0, 0, 0, 0.84);
    padding: calc(56px + env(safe-area-inset-top, 0px)) 28px calc(72px + env(safe-area-inset-bottom, 0px));
    opacity: 0; pointer-events: none; transition: opacity .5s ease;
  }
  .letter-view.show { opacity: 1; pointer-events: auto; }
  .letter-inner { max-width: 34ch; margin: 0 auto; font: 400 15px/1.7 "Space Mono", ui-monospace, Menlo, monospace; color: var(--ink); }
  .letter-inner p { margin: 0 0 1.1em; }
  .letter-inner .sig { text-align: right; white-space: pre-line; }
  .letter-close { margin: 28px 0 0; text-align: center; font: 400 12px "Space Mono", ui-monospace, Menlo, monospace; color: var(--muted); }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="A birthday surprise for Britt: an envelope opens, her letter flows into a heart of I love you, which becomes a birthday cake whose candles she blows out"></canvas>
<p class="hint" id="hint">tap the heart to open<span class="cursor">_</span></p>
<button id="reread" class="reread" type="button">read your letter again</button>
<div id="letterView" class="letter-view" role="dialog" aria-label="Your letter">
  <div class="letter-inner" id="letterInner"></div>
  <p class="letter-close">tap anywhere to close</p>
</div>

   ---------------------------------------------------------------------

     on a tiny hidden canvas (one pixel per character cell), then turn
     each cell into a character. Brighter = denser character, edges get
     / \ | -, and the cell's color tints it. makeAscii() builds one of
     these renderers; the envelope and the cake use different cell sizes.
   - WORD PARTICLES (letter, rivers, heart): each word is an object whose
     position we work out from the clock every frame.

// ---------- helpers ----------
const clamp01 = t => (t < 0 ? 0 : t > 1 ? 1 : t);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const inOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const hash2 = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };
const rand = (a, b) => a + Math.random() * (b - a);
const mix = (c1, c2, t) => c1.map((v, k) => lerp(v, c2[k], t));
const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return v * v * v * p0 + 3 * v * v * u * p1 + 3 * v * u * u * p2 + u * u * u * p3; };
const bezD = (p0, p1, p2, p3, u) => { const v = 1 - u; return 3 * v * v * (p1 - p0) + 6 * v * u * (p2 - p1) + 3 * u * u * (p3 - p2); };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const GLYPHS = '01<>/\\|*+=#%&$?!~^';
function scramble(s, amount, seed) {
  if (amount <= 0) return s;
  let out = '';
  Array.from(s).forEach((c, i) => {
    if (c === ' ') { out += ' '; return; }
    out += hash2(seed, i * 7.13) < amount ? GLYPHS[Math.floor(hash2(seed * 1.7, i * 3.1) * GLYPHS.length)] : c;
  });
  return out;
}

// 1. ASCII renderer factory

const RAMP = ' .,:;-~=+*xoX#%&$@';
const EDGES = ['-', '\\', '|', '/'];

function makeAscii(fontPx, extraChars = '') {
  const A = { fontPx };
  const font = `700 ${fontPx * DPR}px ${MONO}`;
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  A.cwD = Math.max(2, Math.round(m.measureText('M').width)); A.chD = Math.round(fontPx * 1.12 * DPR);
  A.cw = A.cwD / DPR; A.ch = A.chD / DPR;
  A.cols = Math.ceil(W / A.cw); A.rows = Math.ceil(H / A.ch);
  A.src = document.createElement('canvas'); A.src.width = A.cols; A.src.height = A.rows;
  A.sctx = A.src.getContext('2d', { willReadFrequently: true });
  A.glyphs = document.createElement('canvas'); A.glyphs.width = A.cols * A.cwD; A.glyphs.height = A.rows * A.chD;
  A.gctx = A.glyphs.getContext('2d');
  const chars = Array.from(RAMP + EDGES.join(''));
  for (const c of extraChars) if (!chars.includes(c)) chars.push(c);
  A.index = new Map();
  chars.forEach((c, i) => { if (!A.index.has(c)) A.index.set(c, i); });
  A.atlas = document.createElement('canvas'); A.atlas.width = chars.length * A.cwD; A.atlas.height = A.chD;
  const a = A.atlas.getContext('2d');
  a.font = font; a.fillStyle = '#fff'; a.textAlign = 'center'; a.textBaseline = 'middle';
  chars.forEach((c, i) => a.fillText(c, i * A.cwD + A.cwD / 2, A.chD / 2));
  A.lum = new Float32Array(A.cols * A.rows);

  // paint(g) draws the scene in screen pixels. opts: reveal (0..1 random build-in),
  // front {y, band} (only cells below y show), override(c, r) → a forced character.
  A.render = (paint, opts = {}) => {
    const { cols, rows, cw, ch, cwD, chD, lum, sctx, gctx } = A;
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, cols, rows);
    sctx.setTransform(1 / cw, 0, 0, 1 / ch, 0, 0);
    paint(sctx);
    const d = sctx.getImageData(0, 0, cols, rows).data;
    for (let i = 0, n = cols * rows; i < n; i++) {
      const k = i * 4, al = d[k + 3] / 255;
      lum[i] = al < 0.08 ? -1 : ((0.3 * d[k] + 0.59 * d[k + 1] + 0.11 * d[k + 2]) / 255) * al;
    }
    gctx.globalCompositeOperation = 'source-over';
    gctx.clearRect(0, 0, A.glyphs.width, A.glyphs.height);
    const rampMax = RAMP.length - 1, edgeBase = RAMP.length;
    const reveal = opts.reveal ?? 1, front = opts.front, override = opts.override;
    for (let r = 0; r < rows; r++) {
      const ry = (r + 0.5) * ch;
      for (let c = 0; c < cols; c++) {

      wd.slot = sl; wd.exitArc = sl.exitArc;
      wd.v = rand(...CONFIG.riverSpeed);
      // Glide into the river: start from rest, speed up, and join the current at its own speed.
      const dx = Math.abs(rv.xg - wd.x);
      wd.entryArc = arcAtY(rv, wd.y + 34 + dx * 0.55);
      wd.liftT = Math.min(2.2, Math.max(1.1, 0.9 + dx / 140));
      wd.heartCol = heartColor();
    });
  }
  const big = heart.center.size, parts = ['I', 'love', 'you'], sp = textWidth(' ', big);
  const total = parts.reduce((t, p) => t + textWidth(p, big), 0) + sp * 2;
  let x = hc.x - total / 2;
  parts.forEach((p, j) => {
    const w = textWidth(p, big);
    if (loveIdx >= 0) words[loveIdx + j].bigTarget = { x: x + w / 2, y: hc.y + heart.center.y, size: big, text: p };
    x += w + sp;

  spares.forEach(s => { s.col = heartColor(); s.delay = rand(0, 0.9); });

  // The cake takes the heart's place.
  const ar = cake.img.height / cake.img.width;
  cake.w = Math.min(W * 0.92, 540, (H * 0.66) / ar); cake.h = cake.w * ar;
  cake.x = hc.x - cake.w / 2; cake.y = hc.y - cake.h * 0.47;
  cake.candles = CAKE_CANDLES.map(c => ({ x: cake.x + c.x * cake.w, top: cake.y + c.top * cake.h, wickTop: cake.y + c.top * cake.h - cake.h * 0.019 }));
  buildCakeCells();

  // The orb and its stand sit where the camera stops after following the smoke up.
  // Last screen, top to bottom: "Here is your gift", the orb on its stand, "Happy Birthday Baby",
  // then the button. Everything is measured from the screen so it's centered on phones and computers.
  const camEnd = camHeart + H * 0.7;
  const safeBottom = parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
  ui.giftSize = Math.min(W * 0.06, 26); ui.finalSize = Math.min(W * 0.068, 30);
  ui.giftY = Math.max(H * 0.15, 80);
  ui.buttonTop = H - safeBottom - 26 - 44;
  ui.finalY = ui.buttonTop - 32;
  const areaTop = ui.giftY + ui.giftSize / 2 + 26, areaBottom = ui.finalY - ui.finalSize / 2 - 22;
  const D = Math.min(W * 0.5, (areaBottom - areaTop) / 1.76, 300);
  orb.D = D; orb.R = D / 2; orb.cx = W / 2;
  orb.cy = (areaTop + areaBottom) / 2 - camEnd - 0.38 * D;       // sphere center (the whole piece is ~1.76 D tall)
  orb.coneTop = orb.cy + 0.44 * D; orb.coneH = 0.22 * D; orb.coneW = 0.25 * D;
  orb.woodTop = orb.coneTop + orb.coneH - 0.01 * D; orb.woodRx = 0.78 * D; orb.woodRy = 0.18 * D; orb.woodThick = 0.4 * D;
  orb.needles = buildNeedles();
  positionUI();
  makeStars();
}

// Shrink the cake picture to exactly one pixel per character cell by averaging every pixel it
// covers. Browsers shrink pictures differently (Safari skips pixels), which punched holes in the
// cake and made characters blink while it moved; doing it ourselves looks the same everywhere.
function buildCakeCells() {
  const A = cakeAscii, iw = cake.img.width, ih = cake.img.height;
  const gc = Math.max(1, Math.round(cake.w / A.cw)), gr = Math.max(1, Math.round(cake.h / A.ch));
  const tmp = document.createElement('canvas'); tmp.width = iw; tmp.height = ih;
  const t = tmp.getContext('2d', { willReadFrequently: true });
  t.drawImage(cake.img, 0, 0);
  const sd = t.getImageData(0, 0, iw, ih).data, out = new ImageData(gc, gr);
  for (let r = 0; r < gr; r++) {
    const y0 = Math.floor((r * ih) / gr), y1 = Math.max(y0 + 1, Math.floor(((r + 1) * ih) / gr));
    for (let c = 0; c < gc; c++) {
      const x0 = Math.floor((c * iw) / gc), x1 = Math.max(x0 + 1, Math.floor(((c + 1) * iw) / gc));
      let R = 0, G = 0, B = 0, Al = 0, n = 0;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const k = (y * iw + x) * 4, a = sd[k + 3];
          R += sd[k] * a; G += sd[k + 1] * a; B += sd[k + 2] * a; Al += a; n++;
        }
      }
      const o = (r * gc + c) * 4;
      if (Al > 0) { out.data[o] = R / Al; out.data[o + 1] = G / Al; out.data[o + 2] = B / Al; }
      out.data[o + 3] = Al / n;
    }
  }
  cake.cells = document.createElement('canvas'); cake.cells.width = gc; cake.cells.height = gr;
  cake.cells.getContext('2d').putImageData(out, 0, 0);
  cake.gc = gc; cake.gr = gr;
}

// =====================================================================
// The crystal orb: tourmalinated quartz on a brass cone and a wood slice
// ---------------------------------------------------------------------
// The orb is drawn by "ray casting": for every character cell over the orb we work out what
// you'd see looking straight through the glass at that spot: a soft glassy body, a bright rim,
// a highlight, misty veils inside, and the black needles. The needles are 3D lines inside the
// sphere, traced from Logan's photo (with a few extra for the back), so turning the orb moves them.
// =====================================================================
const NEEDLE_DATA = [   // from the photo: x1, y1, x2, y2, thickness (photo pixels; sphere center 430,362, radius 375)
  [268, 88, 390, 612, 9], [425, 168, 470, 322, 16], [566, 108, 551, 422, 9], [650, 122, 548, 255, 6],
  [430, 326, 780, 358, 7], [250, 228, 378, 172, 7], [85, 430, 238, 252, 4], [92, 440, 292, 356, 7],
  [318, 580, 372, 510, 14], [265, 300, 360, 338, 5], [586, 352, 590, 474, 4], [372, 683, 556, 668, 3],
  [640, 372, 778, 512, 8, 1], [352, 32, 380, 165, 6],
];
function buildNeedles() {
  const list = NEEDLE_DATA.map(([x1, y1, x2, y2, t, back], i) => {
    const pt = (x, y, k) => {
      const nx = (x - 430) / 375, ny = (y - 362) / 375;
      const zMax = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)) * 0.85;
      let z = (hash2(i * 3.1 + 1, k) * 2 - 1) * zMax;
      if (back) z = -Math.abs(z);
      return [nx, ny, z];
    };
    return { a: pt(x1, y1, 1), b: pt(x2, y2, 2), r: Math.max(t / 2 / 375, 0.006) };
  });
  for (let k = 0; k < 6; k++) {                    // thin ones for the side the photo can't show
    const th = hash2(k, 7) * Math.PI * 2, ph = (hash2(k, 9) - 0.5) * 2.4, len = 0.25 + hash2(k, 17) * 0.35;
    const c = [(hash2(k, 11) - 0.5) * 0.9, (hash2(k, 13) - 0.5) * 0.9, -0.3 - hash2(k, 15) * 0.35];
    const d = [Math.cos(th) * Math.cos(ph), Math.sin(ph), Math.sin(th) * Math.cos(ph)];
    const clampIn = p => { const m = Math.hypot(...p); return m > 0.92 ? p.map(v => (v * 0.92) / m) : p; };
    list.push({ a: clampIn(c.map((v, j) => v - d[j] * len)), b: clampIn(c.map((v, j) => v + d[j] * len)), r: 0.007 });
  }

}
function h3(x, y, z) { const v = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return v - Math.floor(v); }

  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);

  u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v); w = w * w * (3 - 2 * w);
  const L = (a, b, t) => a + (b - a) * t;

}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1e-9;

const orbBuf = document.createElement('canvas'), orbBufCtx = orbBuf.getContext('2d');
let orbImg = null;

function shadeOrb(img, c0, r0, gcN, grN, A, Ox, Oy, R, reveal, needleAmt, theta) {
  const d = img.data, co = Math.cos(theta), si = Math.sin(theta), cell = A.cw / R;
  const rot = p => [p[0] * co + p[2] * si, p[1], -p[0] * si + p[2] * co];   // spin around the vertical axis
  const ns = orb.needles.map(n => { const a = rot(n.a), b = rot(n.b); return { ax: a[0], ay: a[1], bx: b[0], by: b[1], r: Math.max(n.r, cell * 0.55) }; });
  const lx = Math.cos(now * 0.7), lz = Math.sin(now * 0.7);                // a rim light that circles the orb

      const u = ((c0 + i + 0.5) * A.cw - Ox) / R, v = ((r0 + j + 0.5) * A.ch - Oy) / R, rr = u * u + v * v;
      if (rr > 1 || Math.sqrt(rr) > reveal * 1.15 - hash2(c0 + i, r0 + j) * 0.15) { d[o + 3] = 0; continue; }
      const zf = Math.sqrt(1 - rr), fres = Math.pow(1 - zf, 2.4);

      L += Math.pow(Math.max(0, u * 0.244 - v * 0.298 + zf * 0.922), 60);          // highlight, upper right
      L += Math.pow(Math.max(0, u * lx * 0.97 - v * 0.15 + zf * lz * 0.97), 6) * fres * 0.9;

        veil += Math.max(0, vnoise(ox * 2.3 + 7, v * 2.3 + 3, oz * 2.3) - 0.58) * 2.6;

const woodR = a => 1 + 0.075 * Math.sin(5 * a + 0.6) + 0.045 * Math.sin(3 * a + 2.1) + 0.03 * Math.sin(7 * a + 1.3);
function paintStand(g, cam, theta, woodReveal, coneReveal) {
  const D = orb.D, cx = orb.cx, top = orb.woodTop + cam, rx = orb.woodRx, ry = orb.woodRy, th = orb.woodThick;
  const lw = Math.max(1, cakeAscii.cw * 0.9);

    const N = 90, P = [];
    for (let i = 0; i <= N; i++) { const f = (i / N) * Math.PI * 2, r = woodR(f - theta); P.push([cx + rx * r * Math.cos(f), top + ry * r * Math.sin(f)]); }
    const half = P.slice(0, N / 2 + 1);                                           // the near edge of the slice
    const bark = g.createLinearGradient(cx - rx, 0, cx + rx, 0);
    bark.addColorStop(0, '#3d2c21'); bark.addColorStop(0.35, '#937055'); bark.addColorStop(0.6, '#7a5b42'); bark.addColorStop(1, '#33251b');
    g.fillStyle = bark; g.beginPath();
    half.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    for (let i = half.length - 1; i >= 0; i--) g.lineTo(half[i][0], half[i][1] + th);
    g.closePath(); g.fill();
    g.lineWidth = lw;
    for (let k = 0; k < 46; k++) {                                                // bark ridges that slide around as it turns
      const a = (k / 46) * Math.PI * 2 + hash2(k, 3) * 0.1, f = a + theta, sn = Math.sin(f);
      if (sn < 0.05) continue;
      const r = woodR(a), x = cx + rx * r * Math.cos(f), y = top + ry * r * sn;
      g.strokeStyle = hash2(k, 5) > 0.5 ? '#c09a73' : '#241911';
      g.beginPath(); g.moveTo(x, y + th * 0.1); g.lineTo(x + (hash2(k, 8) - 0.5) * 4, y + th * (0.5 + 0.45 * hash2(k, 6))); g.stroke();
    }
    const tg = g.createRadialGradient(cx, top, 0, cx, top, rx);                   // the cut top of the wood
    tg.addColorStop(0, '#d39a6c'); tg.addColorStop(0.7, '#b77a4e'); tg.addColorStop(1, '#8e5a37');

    const gg = g.createLinearGradient(cx - w, 0, cx + w, 0);
    gg.addColorStop(0, '#5e4720'); gg.addColorStop(0.3, '#d8b45e'); gg.addColorStop(0.45, '#f7e6a6'); gg.addColorStop(0.7, '#a9832f'); gg.addColorStop(1, '#4f3b19');
    g.fillStyle = gg; g.beginPath();

    g.fillStyle = '#8a6a2c'; g.fillRect(cx - D * 0.02, ct + h, D * 0.04, D * 0.03);

}

function paintOrb(g) {
  if (now < tOrb) return;
  const k = now - tOrb, cam = state.cam, A = cakeAscii, theta = k * ((Math.PI * 2) / 14);   // one turn every 14 s
  paintStand(g, cam, theta, smooth(clamp01(k / 1.1)), smooth(clamp01((k - 0.9) / 0.5)));
  const reveal = smooth(clamp01((k - 1.1) / 1.5)), needleAmt = smooth(clamp01((k - 2.2) / 1.0));
  if (reveal <= 0) return;

  const c0 = Math.floor((Ox - R) / A.cw), c1 = Math.ceil((Ox + R) / A.cw), r0 = Math.floor((Oy - R) / A.ch), r1 = Math.ceil((Oy + R) / A.ch);
  const gcN = c1 - c0, grN = r1 - r0;

  shadeOrb(orbImg, c0, r0, gcN, grN, A, Ox, Oy, R, reveal, needleAmt, theta);
  orbBufCtx.putImageData(orbImg, 0, 0);

const paintScene = g => { paintCake(g); paintOrb(g); };

function drawOrbExtras() {
  if (now < tOrb + 2.4) return;
  const appear = smooth(clamp01((now - tOrb - 2.4) / 1.2)), R = orb.R, Ox = orb.cx, Oy = orb.cy + state.cam;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';                          // a soft glow around the orb
  const gr = ctx.createRadialGradient(Ox, Oy, R * 0.6, Ox, Oy, R * 1.6);
  gr.addColorStop(0, `rgba(200,215,255,${0.1 * appear})`); gr.addColorStop(1, 'rgba(200,215,255,0)');
  ctx.fillStyle = gr; ctx.fillRect(Ox - R * 1.6, Oy - R * 1.6, R * 3.2, R * 3.2);
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#dfe6ff';
  ctx.font = `700 ${cakeAscii.fontPx * 1.5}px ${MONO}`;
  for (let i = 0; i < 22; i++) {                                                 // little lights circling it
    const a = now * (0.35 + hash2(i, 1) * 0.25) + i * 2.4, tilt = (hash2(i, 2) - 0.5) * 0.5, rr = R * (1.25 + hash2(i, 3) * 0.35);
    const x = Ox + Math.cos(a) * rr, z = Math.sin(a), y = Oy + z * rr * 0.22 + Math.cos(a) * rr * tilt;

    ctx.globalAlpha = appear * (0.25 + 0.45 * (z + 1) / 2);
    ctx.fillText(z > 0.6 ? '*' : '·', x, y);
  }
  ctx.fillStyle = '#ffffff';

    const period = 2.6, ph = (now + i * 0.9) % period, life = 0.7;

}

// =====================================================================
// 5. Timeline
// =====================================================================
let phase = 'intro', now = 0, t0 = 0, tTap = 0, tFlow = 0;
let tDrop = Infinity, tRead = Infinity, tScroll = Infinity, tFinale = Infinity, tCake = Infinity, tLit = Infinity, tBlow = Infinity, tOrb = Infinity;
let rereadShown = false;
let remnants = [], crumbs = [], puffs = [], lastPuff = 0;

function restart() {
  layoutAll();
  phase = 'intro'; t0 = now; tTap = 0; tFlow = 0;
  tDrop = tRead = tScroll = tFinale = tCake = tLit = tBlow = tOrb = Infinity;
  Object.assign(state, { cam: 0, drop: 0, flap: 0, sealScale: 1, sealAlpha: 1 });
  burst = []; remnants = []; crumbs = []; puffs = [];
  hint.classList.remove('show'); rereadBtn.classList.remove('show'); letterView.classList.remove('show'); rereadShown = false;
}

// Keep the screen awake for the whole show: the letter part has no taps, and phones dim
// after 30 seconds. Works on iPhones with iOS 16.4 or newer.
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* not available: the phone's Auto-Lock setting decides */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && tTap) keepAwake(); });

function open() {
  if (phase !== 'closed') return;
  phase = 'opening'; tTap = now;
  keepAwake();
  hint.classList.remove('show');
  const sy = env.cy - env.h / 2 + env.h * 0.5;
  for (let i = 0; i < 18; i++) {
    const a = rand(0, Math.PI * 2), d = rand(40, 110);
    burst.push({ c: '♥*+·'[i % 4], x: env.cx, y: sy, vx: Math.cos(a) * d, vy: Math.sin(a) * d, t0: now, life: rand(0.6, 1.1) });
  }
}

function startReading() {
  phase = 'read'; tRead = now;
  let lastArrive = 0;
  words.forEach((wd, i) => {
    wd.tRed = tRead + i * CONFIG.readPace;
    wd.tLeave = wd.tRed + CONFIG.leaveDelay + rand(-0.25, 0.25);
    if (!wd.special) lastArrive = Math.max(lastArrive, wd.tLeave + wd.liftT + (wd.exitArc - wd.entryArc) / wd.v + 0.9);
  });
  tScroll = tRead + (words.length - 1) * CONFIG.readPace + 1.0;
  tFinale = Math.max(lastArrive, tScroll + 3.4) + 0.3;
  tCake = tFinale + CONFIG.heartHold;
}

// The heart breaks apart: every word becomes a few falling characters.
function startCake() {
  phase = 'toCake';
  remnants = [];
  words.forEach(wd => {
    if (wd.special) { const T = wd.bigTarget; remnants.push({ x: T.x, y: T.y, size: T.size, text: T.text, col: [255, 70, 88] }); }
    else remnants.push({ x: wd.slot.x, y: wd.slot.y, size: wd.slot.size, text: wd.slot.text, col: wd.heartCol });
  });
  spares.forEach(s => remnants.push({ x: s.x, y: s.y, size: s.size, text: s.text, col: s.col }));
  crumbs = [];
  for (const r of remnants) {
    const w = textWidth(r.text, r.size), n = Math.max(1, Math.min(4, Math.round(w / (r.size * 1.5))));
    for (let j = 0; j < n; j++) {
      crumbs.push({ x: r.x - w / 2 + (w * (j + 0.5)) / n, y: r.y, vx: rand(-30, 30), vy: rand(-70, -10), col: r.col,
        c: '@#%&$*+=xo'[Math.floor(Math.random() * 10)], delay: 0.45 + rand(0, 1.3), gone: false });
    }
  }
}

function blow() {
  if (phase !== 'cake') return;
  phase = 'blow'; tBlow = now; lastPuff = now;
}

function update() {
  const t = now - t0;
  if (phase === 'intro' && t > 1.5) { phase = 'closed'; hint.classList.add('show'); }
  if (phase === 'closed') state.sealScale = 1 + 0.07 * Math.max(0, Math.sin(now * 5.5)) ** 8;
  if (tTap) {
    const k = now - tTap;
    state.sealScale = 1 + 0.6 * smooth(clamp01(k / 0.3));
    state.sealAlpha = 1 - smooth(clamp01(k / 0.3));
    state.flap = Math.PI * 0.64 * inOut(clamp01((k - 0.25) / 0.8));
    state.cam = P * inOut(clamp01((k - 1.6) / 3.2));
    if (phase === 'opening' && k > 1.05) {
      phase = 'flow'; tFlow = now;
      tDrop = tFlow + (words.length - 1) * CONFIG.wordGap + 0.5;
    }
  }
  if (now > tScroll) state.cam = lerp(P, camHeart, inOut(clamp01((now - tScroll) / 3.4)));
  if (now > tBlow) state.cam = camHeart + H * 0.7 * inOut(clamp01((now - tBlow - 1.0) / 4.7));   // follow the smoke up
  state.drop = H * 1.3 * Math.pow(clamp01((now - tDrop) / 1.2), 2.4);
  if (phase === 'flow' && now > tFlow + (words.length - 1) * CONFIG.wordGap + CONFIG.flight + 1.0) startReading();
  if (phase === 'read' && now > tFinale) phase = 'finale';
  if (phase === 'finale' && now > tCake) startCake();
  if (phase === 'toCake' && now > tCake + 3.3) { phase = 'cake'; tLit = now; }
  if (phase === 'blow' && now > tBlow + 4.2) { phase = 'orb'; tOrb = tBlow + 4.2; }        // the stand starts building
  if (phase === 'orb' && !rereadShown && now > tOrb + 3.4 + 15) { rereadShown = true; rereadBtn.classList.add('show'); }
}

// =====================================================================
// 6. Where is each word right now?
// =====================================================================
function wordState(wd, i) {
  if (!tFlow || phase === 'opening') return null;
  const te = tFlow + i * CONFIG.wordGap;
  if (now < te) return null;
  const base = { size: letterPx, weight: 400, text: wd.text, alpha: 1, glow: 0, ang: 0 };

  if (now < te + CONFIG.flight) {                       // a) pulled out of the envelope
    const u = (now - te) / CONFIG.flight, e = inOut(u);
    const mx = env.cx, my = env.cy - env.h / 2 + env.h * 0.24, dy = my - wd.y;
    const c1x = mx + wd.sway, c1y = my - dy * 0.5, c2x = lerp(wd.x, mx, 0.15), c2y = wd.y + dy * 0.3;
    let ang = Math.atan2(bezD(my, c1y, c2y, wd.y, e), bezD(mx, c1x, c2x, wd.x, e)) + Math.PI;
    if (ang > Math.PI) ang -= Math.PI * 2;
    ang *= 1 - smooth(clamp01((u - 0.55) / 0.45));
    return { ...base, x: bez(mx, c1x, c2x, wd.x, e), y: bez(my, c1y, c2y, wd.y, e), ang, col: CONFIG.ink, alpha: smooth(clamp01(u / 0.04)), clip: true };
  }
  const red = smooth(clamp01((now - (wd.tRed ?? Infinity)) / 0.35));
  const col = mix(CONFIG.ink, CONFIG.red, red);
  const glow = red > 0.05 ? 7 * red : 0;

  if (wd.special) {                                      // b) "I love you" waits, then goes to the center
    if (phase !== 'finale') return { ...base, x: wd.x, y: wd.y, col, glow };
    const T = wd.bigTarget, u = clamp01((now - tFinale) / 1.6), e = inOut(u);
    const x = bez(wd.x, wd.x, T.x, T.x, e), y = bez(wd.y, wd.y + 120, T.y - 160, T.y, e);
    return { ...base, x, y, size: lerp(letterPx, T.size, e), weight: e > 0.5 ? 700 : 400, col: mix(CONFIG.red, [255, 70, 88], e), glow: 7 + 9 * e, inHeart: u >= 1 };
  }
  if (wd.tLeave === undefined || now < wd.tLeave) return { ...base, x: wd.x, y: wd.y, col, glow };

  const rv = rivers[wd.side], tl = now - wd.tLeave, T = wd.liftT;
  if (tl < T) {                                          // c) drift out of the letter and ease into the river
    const en = riverAt(rv, wd.entryArc), u = tl / T;
    const reach = (wd.v * T) / 3;                        // arrive moving like the river
    const p1x = wd.x, p1y = wd.y + 6, p2x = en.x - Math.cos(en.ang) * reach, p2y = en.y - Math.sin(en.ang) * reach;
    return { ...base, x: bez(wd.x, p1x, p2x, en.x, u), y: bez(wd.y, p1y, p2y, en.y, u),
      ang: en.ang * smooth(clamp01((u - 0.15) / 0.85)), size: letterPx * lerp(1, 0.9, smooth(u)), col, glow };
  }
  const d = wd.entryArc + wd.v * (tl - T);
  if (d < wd.exitArc) {                                  // d) ride the river, with a little wobble
    const p = riverAt(rv, d), wob = Math.sin(now * 2.3 + i * 1.7) * 3.5 * smooth(clamp01((tl - T) / 0.8));
    return { ...base, x: p.x - Math.sin(p.ang) * wob, y: p.y + Math.cos(p.ang) * wob, ang: p.ang + Math.sin(now * 1.6 + i) * 0.1 * smooth(clamp01((tl - T) / 0.8)), size: letterPx * 0.9, col, glow };
  }
  const ex = riverAt(rv, wd.exitArc), tg = (d - wd.exitArc) / wd.v, sl = wd.slot;
  if (tg < 0.9) {                                        // e) settle into the heart, become "I love you"
    const e = inOut(tg / 0.9), seed = i * 977 + Math.floor(now * 18);
    const text = e < 0.5 ? scramble(wd.text, Math.min(1, e * 2.4), seed) : scramble(sl.text, Math.min(1, (1 - e) * 2.4), seed);
    return { ...base, x: lerp(ex.x, sl.x, e), y: lerp(ex.y, sl.y, e), ang: lerp(ex.ang, 0, e), size: lerp(letterPx * 0.9, sl.size, e),
      weight: e > 0.5 ? 700 : 400, text, col: mix(CONFIG.red, wd.heartCol, e), glow: glow * (1 - e), inHeart: true };
  }
  return { ...base, x: sl.x, y: sl.y, size: sl.size, weight: 700, text: sl.text, col: wd.heartCol, inHeart: true };
}

// =====================================================================
// 7. Drawing
// =====================================================================
let stars = [], burst = [];
function makeStars() {
  stars = Array.from({ length: 110 }, () => ({ x: rand(0, W), y: rand(-H * 2.5, H * 1.2), c: '·+*.'[Math.floor(Math.random() * 4)], ph: rand(0, 6.28), sp: rand(0.6, 1.8) }));
}
function drawStars() {
  ctx.fillStyle = '#9aa3c7'; ctx.font = `${envAscii.fontPx}px ${MONO}`; ctx.textAlign = 'center';
  for (const s of stars) {
    const y = s.y + state.cam * 0.35;
    if (y < -10 || y > H + 10) continue;
    ctx.globalAlpha = 0.08 + 0.3 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph));
    ctx.fillText(s.c, s.x, y);
  }
  ctx.globalAlpha = 1;
}
function drawBurst() {
  burst = burst.filter(p => now - p.t0 < p.life);
  ctx.font = `700 ${envAscii.fontPx * 1.3}px ${MONO}`; ctx.textAlign = 'center';
  for (const p of burst) {
    const u = (now - p.t0) / p.life;
    ctx.globalAlpha = 1 - u; ctx.fillStyle = '#ff6f9a';
    ctx.fillText(p.c, p.x + p.vx * u, p.y + p.vy * u + 60 * u * u);
  }
  ctx.globalAlpha = 1;
}
function beat() {
  if (now < tFinale + 1.7) return 1;
  const amp = clamp01((now - tFinale - 1.7) / 0.6), u = now % 1.15;
  return 1 + amp * (0.045 * Math.exp(-(((u - 0.05) / 0.07) ** 2)) + 0.03 * Math.exp(-(((u - 0.32) / 0.08) ** 2)));
}
function drawWord(s) {
  if (s.alpha <= 0.01) return;
  let { x, y, size } = s;
  if (s.inHeart) { const b = beat(); x = hc.x + (x - hc.x) * b; y = hc.y + (y - hc.y) * b; size *= b; }
  ctx.globalAlpha = s.alpha;
  ctx.font = `${s.weight} ${size}px ${MONO}`;
  ctx.fillStyle = `rgb(${s.col[0] | 0},${s.col[1] | 0},${s.col[2] | 0})`;
  if (s.glow > 0.2) { ctx.shadowColor = 'rgba(255,45,63,0.7)'; ctx.shadowBlur = s.glow; }
  if (s.ang) { ctx.save(); ctx.translate(x, y + state.cam); ctx.rotate(s.ang); ctx.fillText(s.text, 0, 0); ctx.restore(); }
  else ctx.fillText(s.text, x, y + state.cam);
  ctx.shadowBlur = 0;
}
function drawWords() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const states = words.map((wd, i) => wordState(wd, i));
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, env.cy - env.h / 2 + state.cam + state.drop); ctx.clip();
  states.forEach(s => { if (s && s.clip) drawWord(s); });
  ctx.restore();
  states.forEach(s => { if (s && !s.clip) drawWord(s); });
  if (now > tScroll) {
    for (const sp of spares) {
      const u = clamp01((now - tScroll - 0.8 - sp.delay * 2.2) / 0.55);
      if (u <= 0) continue;
      const e = outCubic(u);
      drawWord({ x: sp.x, y: sp.y, size: sp.size * lerp(1.7, 1, e), weight: 700, text: sp.text, col: mix([255, 255, 255], sp.col, e), alpha: e, glow: 0, ang: 0, inHeart: true });
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- the cake: its image, live flames, shimmer, smoke ----------
const cakeFront = () => {                                // the cake builds from the bottom up as the heart rains into it
  const bottom = cake.y + cake.h * 0.93, top = cake.y + cake.h * 0.08;
  return lerp(bottom, top, inOut(clamp01((now - tCake - 0.5) / 2.6)));
};
const flameAmount = () => {
  if (now < tLit) return 0;
  const lit = smooth(clamp01((now - tLit) / 0.8));
  return now < tBlow ? lit : lit * (1 - smooth(clamp01((now - tBlow) / 0.45)));
};

function paintCake(g) {
  const cam = state.cam, A = cakeAscii;
  // Place the cake on whole character cells, so it slides row by row instead of shimmering.
  const gx = Math.round(cake.x / A.cw), gy = Math.round((cake.y + cam) / A.ch);
  const dx = gx * A.cw - cake.x, dy = gy * A.ch - (cake.y + cam);
  g.imageSmoothingEnabled = false;
  g.drawImage(cake.cells, gx * A.cw, gy * A.ch, cake.gc * A.cw, cake.gr * A.ch);
  // A slow band of light sweeps across the cake every few seconds.
  const cyc = ((now - tCake) % 5.5) / 5.5;
  if (now > tCake + 3 && cyc < 0.45) {
    const bx = lerp(cake.x - cake.w * 0.4, cake.x + cake.w * 1.4, cyc / 0.45);
    g.save(); g.globalCompositeOperation = 'source-atop';
    const gr = g.createLinearGradient(bx - cake.w * 0.12, 0, bx + cake.w * 0.12, 0);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(cake.x - cake.w, cake.y + cam, cake.w * 3, cake.h);
    g.restore();
  }
  // Wicks.
  g.strokeStyle = '#6b6b70'; g.lineWidth = Math.max(1.5, cake.w * 0.008);
  for (const c of cake.candles) { g.beginPath(); g.moveTo(c.x + dx, c.top + cam + dy); g.lineTo(c.x + dx, c.wickTop + cam + dy); g.stroke(); }
  // Flames: redrawn every frame so they flicker and sway, then shrink away when blown out.
  const amt = flameAmount();
  if (amt > 0.01) {
    cake.candles.forEach((c, i) => {
      const n = Math.sin(now * 9.1 + i * 2.1) * 0.6 + Math.sin(now * 23.7 + i * 5.3) * 0.4;
      const lean = now > tBlow ? smooth(clamp01((now - tBlow) / 0.45)) * cake.w * 0.03 : 0;
      const fh = cake.h * 0.125 * amt * (1 + 0.08 * n), fw = cake.w * 0.074 * (0.7 + 0.3 * amt);
      const bx = c.x + dx, by = c.wickTop + cam + dy + cake.h * 0.006;
      const tx = bx + Math.sin(now * 3.1 + i) * cake.w * 0.008 + lean, ty = by - fh;
      // soft glow around the flame (becomes a halo of faint characters)
      const glow = g.createRadialGradient(bx, by - fh * 0.45, 0, bx, by - fh * 0.45, cake.w * 0.13);
      glow.addColorStop(0, `rgba(255,170,60,${0.13 * amt})`); glow.addColorStop(1, 'rgba(255,120,40,0)');
      g.fillStyle = glow; g.fillRect(bx - cake.w * 0.13, by - fh * 0.45 - cake.w * 0.13, cake.w * 0.26, cake.w * 0.26);
      const drop = (scale, fill) => {
        const h = fh * scale, w = fw * scale, y2 = by - (fh - h) * 0.15;
        const tipx = lerp(bx, tx, scale), tipy = y2 - h;
        g.fillStyle = fill; g.beginPath(); g.moveTo(tipx, tipy);
        g.bezierCurveTo(tipx + w * 0.2, tipy + h * 0.35, bx + w * 0.55, y2 - w * 0.6, bx, y2);
        g.bezierCurveTo(bx - w * 0.55, y2 - w * 0.6, tipx - w * 0.2, tipy + h * 0.35, tipx, tipy);
        g.fill();
      };
      const outer = g.createRadialGradient(bx, by - fh * 0.3, 0, bx, by - fh * 0.3, fh * 0.9);
      outer.addColorStop(0, '#ffd23f'); outer.addColorStop(0.5, '#ff8a1c'); outer.addColorStop(1, '#ff3d1a');
      drop(1, outer);
      drop(0.55, '#fff2a8');                              // bright core
    });
  }
  // Smoke: soft grey puffs that the renderer turns into wispy characters.
  for (const p of puffs) {
    const age = now - p.born;
    if (age < 0 || age > p.life) continue;
    let x = p.x0 + Math.sin(age * 2.6 + p.ph) * (3 + 11 * age) + p.drift * age;   // curls wider as it rises
    let y = p.y0 - p.rise * (age + 0.25 * age * age) + cam;
    let r = 4 + 12 * age, a = 0.45 * Math.pow(1 - age / p.life, 1.2) * Math.min(1, age * 6);
    const gather = smooth(clamp01((now - tBlow - 3.0) / 2.2));                     // drifts together where the orb forms
    if (gather > 0) {
      x = lerp(x, orb.cx + Math.sin(p.ph) * orb.R * 0.5, gather);
      y = lerp(y, orb.cy + cam + Math.cos(p.ph * 1.3) * orb.R * 0.5, gather);
      r *= 1 - 0.4 * gather;
      a = Math.max(a, 0.18 * gather) * (1 - smooth(clamp01((now - tBlow - 5.0) / 1.2)));
    }
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(240,243,248,${a})`); gr.addColorStop(1, 'rgba(240,243,248,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

function emitSmoke() {
  if (now < tBlow + 0.15) return;
  const age = now - tBlow, rate = age < 2.6 ? 24 : age < 4.5 ? 24 * (1 - (age - 2.6) / 1.9) : 0;  // puffs per second per wick
  if (rate <= 0) { lastPuff = now; return; }
  while (lastPuff < now) {
    lastPuff += 1 / rate;
    cake.candles.forEach((c, i) => {   // consecutive puffs share a phase, so each candle trails one wavy strand
      puffs.push({ x0: c.x + rand(-1.5, 1.5), y0: c.wickTop, born: lastPuff, life: rand(3, 3.8), rise: rand(140, 175), ph: lastPuff * 3.1 + i * 2.1, drift: (i - 1) * 6 + rand(-3, 3) });
    });
  }
  puffs = puffs.filter(p => now - p.born < p.life);
}

function drawCakeExtras() {
  // Real light around the flames, on top of the characters.
  const amt = flameAmount();
  if (amt > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const c of cake.candles) {
      const y = c.wickTop + state.cam - cake.h * 0.05, r = cake.w * 0.16 * (0.92 + 0.08 * Math.sin(now * 11 + c.x));
      const gr = ctx.createRadialGradient(c.x, y, 0, c.x, y, r);
      gr.addColorStop(0, `rgba(255,150,60,${0.22 * amt})`); gr.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = gr; ctx.fillRect(c.x - r, y - r, r * 2, r * 2);
    }
    ctx.restore();
  }
  // "Happy Birthday Britt" types itself above the cake.
  if (now > tCake + 3.6) {
    const n = Math.min(CONFIG.header.length, Math.floor((now - tCake - 3.6) / 0.075));
    const size = Math.min(cake.w * 0.068, 30), w = textWidth(CONFIG.header, size);
    // Gone once the candles are out. The fade goes into the colors themselves, because Safari
    // ignores globalAlpha on text that has a glow.
    const fade = 1 - smooth(clamp01((now - tBlow - 0.6) / 1.4));
    if (fade > 0.01) glowText(CONFIG.header.slice(0, n), hc.x - w / 2, cake.y - cake.h * 0.005 + state.cam, size, fade, 'left');
  }
  // If she hasn't tapped 5 seconds after the candles light, a reminder slowly types itself.
  if (phase === 'cake' && now > tLit + 5) {
    const msg = 'tap to blow out the candles', n = Math.min(msg.length, Math.floor((now - tLit - 5) / 0.09));
    const size = Math.min(cake.w * 0.042, 15), w = textWidth(msg, size, 400);
    ctx.font = `400 ${size}px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#a3a8bb';
    ctx.fillText(msg.slice(0, n), hc.x - w / 2, cake.y + cake.h * 0.99 + size + state.cam);
    ctx.textAlign = 'center';
  }
}

// White text with a pink glow. Its fade lives in the colors, which works in every browser.
function glowText(text, x, y, size, alpha, align = 'center') {
  ctx.globalAlpha = 1;
  ctx.font = `700 ${size}px ${MONO}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(246,241,243,${alpha})`;
  ctx.shadowColor = `rgba(255,79,134,${0.6 * alpha})`; ctx.shadowBlur = 10;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0; ctx.textAlign = 'center';
}

// The last screen's words: "Here is your gift" above the orb, "Happy Birthday Baby" above the button.
// Both type themselves out, left to right, once the orb has finished forming.
function drawFinalText() {
  if (now < tOrb + 3.6) return;
  const typed = (text, start) => text.slice(0, Math.max(0, Math.min(text.length, Math.floor((now - start) / 0.08))));
  const g = typed(CONFIG.giftLine, tOrb + 3.6), f = typed(CONFIG.finalLine, tOrb + 5.4);
  if (g) glowText(g, W / 2 - textWidth(CONFIG.giftLine, ui.giftSize) / 2, ui.giftY, ui.giftSize, 1, 'left');
  if (f) glowText(f, W / 2 - textWidth(CONFIG.finalLine, ui.finalSize) / 2, ui.finalY, ui.finalSize, 1, 'left');
}

function drawRemnants() {                    // the heart breaking into falling characters
  const k = now - tCake;
  if (k < 0.45) {
    for (const r of remnants) {
      drawWord({ x: r.x, y: r.y, size: r.size, weight: 700, text: scramble(r.text, k / 0.45, Math.floor(now * 18) + r.x), col: r.col, alpha: 1, glow: 0, ang: 0, inHeart: true });
    }
    return;
  }
  const front = cakeFront();
  ctx.font = `700 ${cakeAscii.fontPx * 1.6}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const c of crumbs) {
    if (c.gone) continue;
    const t = k - c.delay;
    const x = t > 0 ? c.x + c.vx * t : c.x, y = t > 0 ? c.y + c.vy * t + 170 * t * t : c.y;   // a gentle rain, not a drop
    if (y >= front || y > cake.y + cake.h) { c.gone = t > 0; if (c.gone) continue; }
    const col = mix(c.col, [245, 245, 248], clamp01(t / 0.9));
    ctx.globalAlpha = 1; ctx.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`;
    ctx.fillText(c.c, x, y + state.cam);
  }
  ctx.globalAlpha = 1;
}

function frame(ms) {
  now = ms / 1000;
  update();
  emitSmoke();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  applyView();
  drawStars();
  if (state.drop < H * 1.2) envAscii.render(paintEnvelope, { reveal: phase === 'intro' ? smooth(clamp01((now - t0) / 1.4)) : 1, override: labelOverride });
  if (now > tCake + 0.4) cakeAscii.render(paintScene, now < tCake + 3.2 ? { front: { y: cakeFront() + state.cam, band: cakeAscii.ch * 3 } } : {});
  applyView();
  drawBurst();
  if (now < tCake) drawWords();
  else { drawRemnants(); drawCakeExtras(); drawOrbExtras(); drawFinalText(); }
  requestAnimationFrame(frame);
}

// =====================================================================
// 8. Input and start
// =====================================================================
function onTap() { if (phase === 'closed') open(); else if (phase === 'cake') blow(); }
window.addEventListener('pointerdown', onTap);
window.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onTap(); } });
// "Read your letter again": opens the letter over the spinning orb; she scrolls it herself.
function fillLetterView() {
  letterInner.textContent = '';
  CONFIG.letter.split('\n').filter(Boolean).forEach(t => { const p = document.createElement('p'); p.textContent = t; letterInner.appendChild(p); });
  const sig = document.createElement('p'); sig.className = 'sig'; sig.textContent = CONFIG.signature; letterInner.appendChild(sig);
}
fillLetterView();
rereadBtn.addEventListener('pointerdown', e => e.stopPropagation());
rereadBtn.addEventListener('click', e => { e.stopPropagation(); letterView.scrollTop = 0; letterView.classList.add('show'); rereadBtn.classList.remove('show'); });
letterView.addEventListener('pointerdown', e => e.stopPropagation());
letterView.addEventListener('click', () => { letterView.classList.remove('show'); rereadBtn.classList.add('show'); });
function positionUI() {
  hint.style.top = `${view.oy + (env.cy + env.h / 2 + 22) * view.k}px`;
  rereadBtn.style.top = `${view.oy + ui.buttonTop * view.k}px`;
}
// If the screen changes size (the app's panel opening, the address bar sliding), lay the show out
// again if it hasn't started yet; otherwise scale it to fit so nothing ever stretches.
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 120); });
function onResize() {
  if (phase === 'intro' || phase === 'closed') { restart(); return; }
  const sw = window.innerWidth, sh = window.innerHeight;
  canvas.width = Math.round(sw * DPR); canvas.height = Math.round(sh * DPR);
  const k = Math.min(sw / W, sh / H);
  view = { k, ox: (sw - W * k) / 2, oy: (sh - H * k) / 2 };
  positionUI();
}
// If the font finishes loading after the first layout, measure again before the show starts.
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => {
    if (phase === 'intro' || phase === 'closed') { widthCache.clear(); fitCache.clear(); restart(); }   // remeasure
  });
}

async function boot() {
  cake.img = new Image();
  cake.img.src = CAKE_SRC;
  try { await cake.img.decode(); } catch (e) { /* drawImage still works once loaded */ }
  try {
    await Promise.race([
      Promise.all([document.fonts.load(`700 12px ${MONO}`), document.fonts.load(`400 12px ${MONO}`)]).then(() => document.fonts.ready),
      new Promise(r => setTimeout(r, 4000)),
    ]);
  } catch (e) { /* system monospace is fine */ }
  widthCache.clear(); fitCache.clear();
  now = performance.now() / 1000;
  restart();
  if (location.hash === '#cake') skipToHeart();   // add #cake to the link to jump to the finished heart
  if (location.hash === '#orb') skipToOrb();      // add #orb to jump to the candles being blown out
  requestAnimationFrame(frame);
}

// Testing shortcut: start at the finished heart, just before it becomes the cake.
function skipToHeart() {
  hint.classList.remove('show');
  phase = 'finale'; tTap = 0; tFlow = now - 100; tDrop = now - 50;
  words.forEach(wd => { wd.tRed = now - 60; wd.tLeave = now - 50; });
  tScroll = now - 20; tFinale = now - 2; tCake = now + 2;
}
// Testing shortcut: start just after the candles are blown out.
function skipToOrb() {
  skipToHeart();
  phase = 'blow'; tCake = now - 12; tLit = now - 8; tBlow = now - 3.4; lastPuff = tBlow;
  remnants = []; crumbs = [];
}
boot();
</script>
</body>
</html>
